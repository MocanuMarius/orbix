<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102127"><title>Spirit fire across the woods · Wispbound</title><style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#0c191f;color:#eee9d6}*{box-sizing:border-box}body{margin:0;padding:22px max(15px,env(safe-area-inset-right)) 24px max(15px,env(safe-area-inset-left))}main{max-width:1050px;margin:auto}header{display:flex;justify-content:space-between;gap:14px;margin-bottom:16px}.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#a5b7a5;margin:0 0 5px}h1{font-size:clamp(25px,5vw,36px);font-weight:600;letter-spacing:-.025em;margin:0 0 8px}.intro{font-size:13px;line-height:1.6;color:#becbbd;margin:0}a{color:#bdc9ac;font-size:12px;white-space:nowrap;padding-top:5px;text-decoration:none}figure{margin:0;border:1px solid #38504a;border-radius:11px;overflow:hidden;background:#061015}video{display:block;width:100%;height:auto;background:#061015}figcaption{font-size:12px;line-height:1.6;color:#b7c8b9;padding:10px 13px}.watch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 11px}.watch h2{font-size:15px;font-weight:500;margin:0}.playback{display:flex;gap:6px}button{font:inherit;font-size:12px;color:#ecebd4;background:#20392f;border:1px solid #48604f;border-radius:7px;min-height:44px;padding:10px 12px;cursor:pointer}button:hover{background:#314e3d}button:focus-visible{outline:2px solid #e9d59e;outline-offset:3px}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:11px}nav button{text-align:left;border-top:3px solid var(--ink);color:var(--ink);line-height:1.5;padding:9px 11px}nav small{display:block;color:#bdc7b9;font-size:10px}nav button[aria-pressed=true]{background:#364d42;border-color:var(--ink)}.pinewood{--ink:#b4ce9e}.frost{--ink:#a1e4ee}.basalt{--ink:#edbd7a}.fungal{--ink:#d1b4eb}.hidden{display:none}.fine{font-size:11px;color:#91a99b;line-height:1.6;margin:14px 0 0}#status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:600px){body{padding-top:18px}.intro{font-size:12px}nav{grid-template-columns:repeat(2,1fr);gap:6px}nav button{padding:8px 10px}.watch h2{font-size:13px}button{font-size:11px;padding:8px 10px}.playback{gap:5px}figcaption{font-size:11px;padding:9px 11px}header a{font-size:11px}}
</style></head><body><main><header><div><p class="eyebrow">Wispbound · spirit fire</p><h1>One flow, each biome’s color</h1><p class="intro">The approved flowing edge, colored for its world. Four actual biomes, ready to watch.</p></div><a href="./">Back</a></header><figure><video id="comparison" src="./assets/previews/biome-edges-grid.mp4" poster="./assets/previews/biome-edges-grid.jpg" autoplay muted loop playsinline preload="auto" aria-label="Four actual biomes with spirit fire edges in sage, ice cyan, amber, and violet"></video><figcaption>The same Spirit Fire flow follows firm terrain. Its color matches each biome.</figcaption></figure><div class="watch"><h2>A closer look</h2><div class="playback"><button id="still">Compare still</button><button id="pause" aria-pressed="false">Pause videos</button></div></div><nav aria-label="Enlarge a biome"><button class="pinewood" data-biome="pinewood" aria-pressed="true">Oldgrowth Pines<small>Sage</small></button><button class="frost" data-biome="frost" aria-pressed="false">Frostbound Reach<small>Ice cyan</small></button><button class="basalt" data-biome="basalt" aria-pressed="false">Basalt Furnace<small>Amber</small></button><button class="fungal" data-biome="fungal" aria-pressed="false">Spore Hollows<small>Violet</small></button></nav><figure><video id="pinewood" src="./assets/previews/biome-edges-pinewood.mp4" poster="./assets/previews/biome-edges-pinewood.jpg" muted loop playsinline preload="metadata" aria-label="Oldgrowth Pines with sage spirit fire"></video><video id="frost" class="hidden" src="./assets/previews/biome-edges-frost.mp4" poster="./assets/previews/biome-edges-frost.jpg" muted loop playsinline preload="metadata" aria-label="Frostbound Reach with ice cyan spirit fire"></video><video id="basalt" class="hidden" src="./assets/previews/biome-edges-basalt.mp4" poster="./assets/previews/biome-edges-basalt.jpg" muted loop playsinline preload="metadata" aria-label="Basalt Furnace with amber spirit fire"></video><video id="fungal" class="hidden" src="./assets/previews/biome-edges-fungal.mp4" poster="./assets/previews/biome-edges-fungal.jpg" muted loop playsinline preload="metadata" aria-label="Spore Hollows with violet spirit fire"></video><figcaption id="caption">Oldgrowth Pines · sage Spirit Fire</figcaption></figure><p class="fine">Recorded with the actual game renderer. No playing or phone rotation needed.</p><p id="status" role="status"></p></main><script>
const videos=[...document.querySelectorAll('video')],comparison=document.querySelector('#comparison'),pause=document.querySelector('#pause');const keys=['pinewood','frost','basalt','fungal'];let paused=false,selected='pinewood';
const captions={pinewood:'Oldgrowth Pines · sage Spirit Fire',frost:'Frostbound Reach · ice cyan Spirit Fire',basalt:'Basalt Furnace · amber Spirit Fire',fungal:'Spore Hollows · violet Spirit Fire'};
function current(){return document.querySelector('#'+selected);}
function seek(video,time){if(Number.isFinite(video.duration)&&video.duration>0)try{video.currentTime=Math.min(time,video.duration-.05);}catch{}}
function align(video){if(Number.isFinite(comparison.currentTime)&&Number.isFinite(video.duration)&&Math.abs(video.currentTime-comparison.currentTime)>.12)seek(video,comparison.currentTime);}
function updatePlayback(){for(const video of videos){video.muted=true;if(paused||document.hidden||(video!==comparison&&video!==current()))video.pause();else video.play()?.catch(()=>{});}}
function pausedUI(){pause.textContent=paused?'Play videos':'Pause videos';pause.setAttribute('aria-pressed',String(paused));}
for(const video of videos)video.addEventListener('loadedmetadata',()=>{seek(video,3);if(video!==comparison&&video===current()&&comparison.readyState>=1)align(video);updatePlayback();},{once:true});
for(const button of document.querySelectorAll('[data-biome]'))button.addEventListener('click',()=>{selected=button.dataset.biome;for(const key of keys)document.querySelector('#'+key).classList.toggle('hidden',key!==selected);for(const item of document.querySelectorAll('[data-biome]'))item.setAttribute('aria-pressed',String(item===button));align(current());document.querySelector('#caption').textContent=captions[selected];updatePlayback();});
pause.addEventListener('click',()=>{paused=!paused;pausedUI();align(current());updatePlayback();});document.querySelector('#still').addEventListener('click',()=>{paused=true;pausedUI();for(const video of videos)video.pause();seek(comparison,3);seek(current(),3);});comparison.addEventListener('timeupdate',()=>{if(!paused)align(current());});document.addEventListener('visibilitychange',updatePlayback);window.addEventListener('pagehide',()=>{for(const video of videos)video.pause();},{once:true});for(const video of videos)video.addEventListener('error',()=>{document.querySelector('#status').textContent='The recording is still loading. Please try again shortly.';});updatePlayback();
</script></body></html>
