<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07110e">
  <title>Deck workbench · Wispbound</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#07110e;color:#e4eddb}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 20%,#17342a,transparent 65%)}main{max-width:29rem;text-align:center}.eyebrow{font-size:.75rem;letter-spacing:.2em;color:#9abcaa}h1{font-size:clamp(2rem,7vw,3rem);margin:.5rem 0 1rem;font-weight:650}p{line-height:1.65;color:#b5c8bb}button{font:inherit;font-weight:650;min-height:52px;width:100%;margin-top:12px;border:1px solid #bee09a;border-radius:8px;background:#d5edb6;color:#132319;padding:14px 20px;cursor:pointer}button:focus-visible{outline:3px solid #fff;outline-offset:5px}button:disabled{opacity:.65;cursor:wait}small{display:block;color:#8ca796;font-size:.8rem;line-height:1.6}
  </style>
</head>
<body data-card-workbench="true">
  <main>
    <div class="eyebrow">WISPBOUND · SAMPLE DECK</div>
    <h1>Deck workbench</h1>
    <p id="status" role="status" aria-live="polite">Preparing the latest cards…</p>
    <button id="launch" type="button">Open sample deck</button>
    <small>Browse, equip and melt sample cards in landscape. This sample resets on reload and keeps your saved journeys safe.</small>
    <noscript><p>The card workbench needs JavaScript. Enable it, then reopen this page.</p></noscript>
  </main>
  <script type="module" src="./cards-launcher.mjs?v=readable-1"></script>
</body>
</html>
