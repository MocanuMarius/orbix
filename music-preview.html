<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The evolving score · Wispbound</title><link rel="stylesheet" href="black-hole-preview.css"><style>main{max-width:850px}section{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}button{min-height:64px;padding:12px;font:inherit}button[aria-pressed=true]{background:#31564b;border-color:#e4dca4}h1{font-size:28px}p{line-height:1.6}@media(max-width:550px){section{grid-template-columns:1fr 1fr}}</style><main><h1>The evolving score</h1><p>Mystical synth, shifting arpeggios and a stronger pulse. Pick a scene to hear the mix change. Each layer follows the same seven-minute composition.</p><section><button data-scene="menu">Quiet checkpoint</button><button data-scene="flight">Flight</button><button data-scene="flight" data-pressure="1">Danger</button><button data-scene="boss" data-pressure="1">Guardian</button><button data-scene="dream">Dream</button><button data-scene="clear">Passage cleared</button></section><p id="status" role="status">Tap a scene to play. Changes fade smoothly.</p><button id="mute">Music off</button><p><a href="./">Play Wispbound</a></p></main><script type="module">import{createMusic}from './music.mjs?v=spark-choices-2';const music=createMusic();const buttons=[...document.querySelectorAll('[data-scene]')];for(const button of buttons)button.onclick=()=>{music.setEnabled(true);music.setScene(button.dataset.scene,Number(button.dataset.pressure)||0);for(const b of buttons)b.setAttribute('aria-pressed',String(b===button));document.querySelector('#status').textContent=button.textContent+' · adapting the mix';document.querySelector('#mute').textContent='Music off';};document.querySelector('#mute').onclick=e=>{music.setEnabled(!music.enabled);e.target.textContent=music.enabled?'Music off':'Music on';};</script></html>
