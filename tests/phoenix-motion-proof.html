<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emberwing continuous motion preview</title>
<style>body{margin:0;background:#071327;color:#e1e8f4;font:14px system-ui}main{max-width:720px;margin:auto}h1{font:24px Georgia;margin:16px}p,output{display:block;margin:12px 16px;line-height:1.5;color:#bccbe0}canvas{display:block;width:100%;height:auto}nav{display:flex;gap:9px;margin:12px 16px}button,a{border:1px solid #afbdcd66;background:#1d3046;color:#e5ebf4;padding:11px;border-radius:6px;text-decoration:none}a[hidden]{display:none}</style>
<main><h1>Live 3D phoenix</h1><p>The production Three.js model: articulated wings, volumetric feather fans, flexible tail and shaded plumage. Shown larger for inspection.</p><div id="view"></div><nav><button id="record">Record six-second preview</button><a id="download" hidden download="Emberwing-3D-motion.webm">Download preview</a></nav><output id="status">Loading model…</output></main>
<script type="module">
import * as PIXI from '/vendor/pixi.mjs';
import { Phoenix3D } from '/phoenix-3d.mjs';
import { PhoenixFlameEffects } from '/flame-effects.mjs';
import { PhoenixFlight, seededRandom } from '/flight.mjs';
const app=new PIXI.Application();await app.init({width:720,height:480,resolution:1,antialias:true,autoStart:false,preference:'webgl',background:'#0b1531'});
document.querySelector('#view').append(app.canvas);
const background=await PIXI.Assets.load('/assets/moonlit-valley.png');
const sky=new PIXI.Sprite(background);sky.width=720;sky.height=480;sky.alpha=.75;app.stage.addChild(sky);
const glow=new PIXI.Graphics();for(let r=47;r>=2;r-=3)glow.circle(48,48,r).fill({color:0xffffff,alpha:.015+.075*(1-r/48)**2});
const glowTexture=app.renderer.generateTexture({target:glow,resolution:1});glow.destroy();
const spark=new PIXI.Graphics().ellipse(15,2,15,1.6).fill(0xffffff);const sparkTexture=app.renderer.generateTexture({target:spark,resolution:1});spark.destroy();
const world=new PIXI.Container();world.scale.set(1.8);world.position.set(20,-30);app.stage.addChild(world);
const flames=new PhoenixFlameEffects({glowTexture,sparkTexture: sparkTexture});world.addChild(flames.container);
const rig=new Phoenix3D(),liveTexture=PIXI.Texture.from(rig.canvas),actor=new PIXI.Sprite(liveTexture);actor.anchor.set(.5);actor.width=actor.height=180;world.addChild(actor);
let engine,started,previous,lastBeat,emission,frames=0;
function reset(){engine={time:0,visualTime:0,distance:0,renderDistance:0,renderPlayerY:145,player:{x:200,y:145,vy:0},flame:100,flaps:0,boosts:0,boostTime:0,lastFlapTime:-1000,reducedMotion:false,particles:[],trail:[],cosmeticRng:seededRandom('motion-preview')};started=performance.now();previous=started;lastBeat=-1;emission=0;}
reset();
function frame(now){
 const dt=Math.min(.04,(now-previous)/1000);previous=now;engine.time=(now-started)/1000;engine.visualTime=engine.time;
 const beat=Math.floor(engine.time/1.35);if(beat!==lastBeat){lastBeat=beat;engine.lastFlapTime=engine.time;engine.flaps++;}
 const boostPhase=engine.time%6;const boosted=boostPhase>3.2&&boostPhase<4.1;
 if(boosted&&engine.boostTime===0)engine.boosts++;
 engine.boostTime=boosted?.5:0;engine.distance+=dt*(boosted?230:154);engine.renderDistance=engine.distance;
 engine.player.vy=Math.sin((engine.time%1.35)/1.35*Math.PI*2)*140;
 engine.player.y=145+Math.sin(engine.time*1.5)*4;engine.renderPlayerY=engine.player.y;
 engine.trail.push({worldX:engine.distance+engine.player.x-23,y:engine.player.y+6,time:engine.time,width:boosted?9:4.6,boost:boosted});
 while(engine.trail.length>72||engine.trail[0]&&engine.time-engine.trail[0].time>1.15)engine.trail.shift();
 emission+=dt*(boosted?84:45);while(emission>=1){emission--;PhoenixFlight.prototype.emitFlame.call(engine);}
 for(const p of engine.particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=8*dt;p.rotation=Math.atan2(p.vy,p.vx);}engine.particles=engine.particles.filter(p=>p.life>0);
 actor.position.set(engine.player.x,engine.player.y);actor.rotation=Math.sin(engine.time*1.3)*.05;rig.render(engine,engine.time);liveTexture.source.update();flames.render(engine);app.render();frames++;
 if(frames%60===0)document.querySelector('#status').textContent='Live Three.js geometry · '+(boosted?'Boost blaze':'wingbeat and glide')+' · '+engine.particles.length+' bounded particles';
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.querySelector('#record').onclick=()=>{
 reset();const chunks=[],stream=app.canvas.captureStream(60);
 const type=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';
 const recorder=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:4500000});
 const button=document.querySelector('#record');button.disabled=true;button.textContent='Recording…';
 recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
 recorder.onstop=()=>{const blob=new Blob(chunks,{type});const link=document.querySelector('#download');link.href=URL.createObjectURL(blob);link.hidden=false;button.disabled=false;button.textContent='Record six-second preview';stream.getTracks().forEach(t=>t.stop());};
 recorder.start();setTimeout(()=>recorder.stop(),6000);
};
</script></html>
