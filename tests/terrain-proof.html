<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emberwing landform lighting</title><style>body{margin:0;background:#071326;color:#dfe5ef;font:14px system-ui}main{max-width:430px;margin:auto}h1{font:23px Georgia;margin:14px}p{margin:12px 14px;color:#becde0;line-height:1.5}#view{position:relative;height:620px}canvas{width:100%;height:100%;display:block}nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px}button,select{background:#1b3044;border:1px solid #708aa3;color:#e8edf3;border-radius:5px;padding:9px}output{display:block;margin:12px;font:12px/1.5 monospace;white-space:pre-wrap}</style>
<main><h1>Landform & material inspection</h1><p>Production terrain, feather model and lighting. Broad relief shapes the light; fine stone grain stays attached while the camera travels.</p><nav><select id="biome" aria-label="Terrain"><option value="storm">Alpine ridge</option><option value="ruins">Eroded terraces</option><option value="canopy">Root banks</option></select><button id="cave">Cave vault</button><button id="motion">Freeze light</button><button id="form">Relief on</button><button id="grain">Grain on</button><button id="check">Run relief checks</button></nav><div id="view"><canvas id="flight"></canvas></div><output id="result">Loading production renderer…</output></main>
<script type="module">
import {PhoenixFlight} from '/flight.mjs';
let engine, terrain='storm', cave=false, frozen=false, relief=true, grain=true, phase=0, previous=performance.now(), busy=false;
const canvas=document.querySelector('#flight'), output=document.querySelector('#result');
function setup(){engine?.destroy();engine=new PhoenixFlight({canvas,seed:'geology-proof',terrain,passage:cave?'cavern':'open',duration:34,assets:{background:'/assets/moonlit-valley.png',phoenixRig:'/assets/phoenix-rig.png'}});engine.paused=true;engine.distance=680;engine.previousDistance=680;engine.renderDistance=680;engine.getWispState=(y,t=engine.time)=>{const x=210+Math.sin(t*.6)*85,wy=430+Math.cos(t*.5)*65;return{x,y:wy,homeX:68,homeY:y+16,radius:100,recovery:1,phase:'ready',carrying:false}};}
function render(){if(!engine.pixiView?.ready)return;engine.time=phase;engine.visualTime=phase;engine.player.y=engine.height*.57+Math.sin(phase*.7)*20;engine.previousPlayerY=engine.player.y;engine.renderPlayerY=engine.player.y;engine.lastFlapTime=Math.floor(phase/1.8)*1.8;engine.render();const view=engine.pixiView, uniforms=view.terrainLight.resources.lighting.uniforms;uniforms.uFormStrength=relief?1:0;uniforms.uGrainStrength=grain?1:0;view.application.render();}
setup();
function frame(now){const dt=Math.min(.05,(now-previous)/1000);previous=now;if(!frozen&&!busy)phase+=dt;if(!busy)render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
document.querySelector('#biome').onchange=e=>{terrain=e.target.value;setup()};
document.querySelector('#cave').onclick=e=>{cave=!cave;e.target.textContent=cave?'Open ridge':'Cave vault';setup()};
document.querySelector('#motion').onclick=e=>{frozen=!frozen;e.target.textContent=frozen?'Animate light':'Freeze light'};
document.querySelector('#form').onclick=e=>{relief=!relief;e.target.textContent=relief?'Relief on':'Relief off';render()};
document.querySelector('#grain').onclick=e=>{grain=!grain;e.target.textContent=grain?'Grain on':'Grain off';render()};
async function pixels(){const c=await engine.pixiView.application.renderer.extract.canvas({target:engine.pixiView.application.stage});return c.getContext('2d').getImageData(0,0,c.width,c.height).data}
function difference(a,b){let count=0,sum=0;for(let i=0;i<a.length;i+=4){const d=Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2]);if(d>3)count++;sum+=d}return{count,mean:sum/(a.length/4)}}
document.querySelector('#check').onclick=async()=>{busy=true;const old=relief,oldGrain=grain;relief=true;grain=true;render();const a=await pixels();relief=false;render();const b=await pixels();relief=true;grain=false;render();const c=await pixels();const form=difference(a,b),micro=difference(a,c);relief=old;grain=oldGrain;render();output.textContent=`${form.count>300?'PASS':'FAIL'} broad landform relief changes lighting: ${form.count} pixels\n${micro.count>50?'PASS':'FAIL'} mineral grain changes specular response: ${micro.count} pixels\nRenderer: ${engine.pixiView.canvas.dataset.phoenixRenderer}; material: ${engine.pixiView.canvas.dataset.terrainMaterial}; error: ${engine.pixiView.canvas.dataset.materialError || "none"}\nTerrain pieces: ${engine.pixiView.obstacles.size}; form children: ${engine.pixiView.formLayer.children.length}; height: ${engine.height}; distance: ${engine.distance}\nMacro relief is a 2.5D material surface; collisions use the same authored silhouette.`;busy=false};
</script></html>
