<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#091714"><title>Rhythm practice · Wispbound</title>
  <link rel="stylesheet" href="style.css?v=stops-2"><link rel="stylesheet" href="game.css?v=stops-2">
  <link rel="stylesheet" href="replay.css?v=stops-2"><link rel="stylesheet" href="typography.css?v=stops-2">
  <link rel="stylesheet" href="rhythm-score.css?v=stops-2"><link rel="stylesheet" href="rhythm-preview.css?v=stops-2">
</head><body class="playing rhythm-preview">
  <main class="flight-device" aria-label="Rhythm card practice flight">
    <div class="flight-hud"><span>RHYTHM · PRACTICE</span></div>
    <div class="flight-artifact-bar" aria-label="Artifact strip"><span id="preview-artifact"></span></div>
    <div class="canvas-wrap"><canvas aria-label="Tap to Lift and start a Rhythm phrase" tabindex="0"></canvas></div>
    <aside class="rhythm-preview-tools">
      <p>Tap twice to set a tempo. Catch the third note when it brightens.</p>
      <div><button type="button" id="reset">Reset</button><button type="button" id="pause">Pause</button><label><input type="checkbox" id="reduced"> Still notes</label><label><input type="checkbox" id="black-hole"> Black hole</label></div>
      <small>No hearts or saved run used. Tap the sky, Lift, or Space.</small>
      <output id="preview-status" aria-live="polite">Ready for your first note.</output>
      <output id="preview-rate" aria-label="World speed">World · 1.00×</output>
    </aside>
    <div class="flight-dock"><button type="button" class="flight-control flap-control" id="flap-btn" aria-label="Lift">↑<span>LIFT</span></button></div>
  </main>
  <script type="module" src="rhythm-preview.mjs?v=stops-2"></script>
</body></html>
