<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#09141b">
 <meta name="robots" content="noindex">
 <title>First Light · Terrain before & after</title>
 <style>
  :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#09141b;color:#e6edde}
  *{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at top,#183333 0,transparent 58%),#09141b}
  main{max-width:760px;margin:auto;padding:28px 20px 32px}header{margin-bottom:18px}.eyebrow{margin:0 0 7px;font-size:12px;letter-spacing:.18em;color:#bdcfac;text-transform:uppercase}
  h1{font-size:clamp(25px,5vw,35px);line-height:1.13;margin:0 0 9px;font-weight:650;letter-spacing:-.025em}.intro{margin:0;color:#aebfbc;font-size:14px;line-height:1.5}
  .choices{display:flex;gap:8px;margin:20px 0 14px}button{border:1px solid #405c58;background:#132723;color:#c6d8ca;border-radius:100px;padding:11px 17px;font:600 14px system-ui;cursor:pointer;flex:1;min-height:44px}
  button[aria-pressed="true"]{border-color:#b1c994;background:#b1c994;color:#13221d}button:focus-visible,a:focus-visible{outline:3px solid #edcea3;outline-offset:4px}
  figure{margin:0;display:flex;flex-direction:column;align-items:center}video{display:block;width:min(100%,540px);height:auto;aspect-ratio:3/4;background:#050c10;border:1px solid #2c4442;border-radius:10px;box-shadow:0 20px 70px #0005}
  figcaption{font-size:13px;line-height:1.5;color:#aebfbc;text-align:center;margin:13px 0 0}.downloads{font-size:12px;text-align:center;line-height:1.8;color:#7f9a96;margin:15px 0 0}a{color:#c5d9bc;text-underline-offset:3px}
  @media(max-width:460px){main{padding:20px 14px 26px}header{margin-bottom:14px}.choices{margin-top:16px}button{padding:10px 8px;font-size:13px}video{border-radius:7px}}
  @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
 </style>
</head>
<body>
 <main>
  <header><p class="eyebrow">Wispbound · First Light</p><h1>Terrain before &amp; after</h1><p class="intro">See how light fades inside rock and how the foreground moves past the wisp.</p></header>
  <nav class="choices" aria-label="Choose a biome"><button type="button" data-biome="pinewood" aria-pressed="true">Oldgrowth Pines</button><button type="button" data-biome="basalt" aria-pressed="false">Basalt Furnace</button></nav>
  <figure>
   <video id="comparison" controls muted playsinline loop preload="metadata" poster="assets/previews/first-light-pinewood.jpg" aria-label="Oldgrowth Pines gameplay: before above, First Light terrain below"><source src="assets/previews/first-light-pinewood.mp4" type="video/mp4">Your browser cannot play this video. <a href="assets/previews/first-light-pinewood.mp4">Open the Oldgrowth Pines comparison</a>.</video>
   <figcaption>12 seconds of gameplay. Before above, after below.<br>Matched movement and a complete phone-landscape frame.</figcaption>
  </figure>
  <p class="downloads">Open MP4: <a href="assets/previews/first-light-pinewood.mp4">Oldgrowth Pines</a> · <a href="assets/previews/first-light-basalt.mp4">Basalt Furnace</a><br><a href="./first-light.html">Play First Light</a></p>
 </main>
 <script>
  const video=document.querySelector('#comparison');
  const names={pinewood:'Oldgrowth Pines',basalt:'Basalt Furnace'};
  document.querySelectorAll('[data-biome]').forEach(button=>button.addEventListener('click',()=>{
   if(button.getAttribute('aria-pressed')==='true')return;
   video.pause();const biome=button.dataset.biome;
   document.querySelectorAll('[data-biome]').forEach(choice=>choice.setAttribute('aria-pressed',String(choice===button)));
   video.poster=`assets/previews/first-light-${biome}.jpg`;video.src=`assets/previews/first-light-${biome}.mp4`;
   video.setAttribute('aria-label',`${names[biome]} gameplay: before above, First Light terrain below`);video.load();
  }));
 </script>
</body>
</html>
