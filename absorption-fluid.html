<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1217">
  <title>Spark absorption · Wispbound</title>
  <link rel="stylesheet" href="./absorption-fluid.css?v=deck-flow-1">
</head>
<body>
<main>
  <header>
    <h1>Spark absorption</h1>
    <div class="styles" role="group" aria-label="Fluid style">
      <button data-style="hybrid" aria-pressed="true">Hybrid</button>
      <button data-style="mist">Mist</button>
      <button data-style="ribbon">Liquid ribbon</button>
      <button data-style="undertow">Undertow</button>
    </div>
    <div class="masses" role="group" aria-label="Spark size">
      <button data-mass="2">Cluster</button>
      <button data-mass="3" aria-pressed="true">Cache</button>
    </div>
  </header>
  <section class="stage" aria-label="Absorption animation">
    <canvas id="scene" aria-label="A large Spark meets the wisp. Its shell pops and its contents flow into the wisp."></canvas>
    <div class="stage-caption"><span id="phase">Approach</span></div>
  </section>
  <div class="transport">
    <button id="play" aria-label="Pause playback">Ⅱ</button>
    <button id="replay" aria-label="Replay from the beginning">↻ Replay</button>
    <input id="time" type="range" min="0" max="1000" step="1" value="0" aria-label="Scrub animation">
    <button id="speed" aria-label="Playback speed">1×</button>
    <button id="angle" aria-label="Change approach angle">↗ Above</button>
  </div>
</main>
<script type="module" src="./absorption-fluid-preview.mjs?v=deck-flow-1"></script>
</body>
</html>
