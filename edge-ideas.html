<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102127"><title>Four edge ideas · Wispbound</title><style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#0c191f;color:#efe9d5}*{box-sizing:border-box}body{margin:0;padding:22px max(15px,env(safe-area-inset-right)) 24px max(15px,env(safe-area-inset-left))}main{max-width:1050px;margin:auto}header{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:16px}.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#a2b7a7;margin:0 0 5px}h1{font-size:clamp(26px,5vw,38px);letter-spacing:-.025em;font-weight:600;margin:0 0 8px}.intro{font-size:13px;color:#bbcabd;margin:0;line-height:1.6}a{font-size:12px;color:#c0cbaa;white-space:nowrap;padding-top:5px;text-decoration:none}figure{margin:0;border:1px solid #38504a;border-radius:11px;overflow:hidden;background:#061015}video{display:block;width:100%;height:auto;background:#061015}figcaption{font-size:12px;color:#b9c8bb;line-height:1.6;padding:10px 13px}.watch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 11px}.watch h2{font-size:15px;font-weight:500;margin:0}.playback{display:flex;gap:6px}button{font:inherit;font-size:12px;min-height:44px;border:1px solid #48604e;border-radius:7px;padding:10px 12px;background:#20392f;color:#ebe9d0;cursor:pointer}button:hover{background:#314e3d}button:focus-visible{outline:2px solid #ebd797;outline-offset:3px}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:11px}nav button{border-top:3px solid var(--ink);color:var(--ink);text-align:left;line-height:1.5;padding:9px 11px}nav button[aria-pressed=true]{background:#385044;border-color:var(--ink)}nav small{display:block;color:#bac7b8;font-size:10px;font-weight:400}.carved{--ink:#e4dbb6}.spectral{--ink:#96e7ec}.roots{--ink:#b0cb86}.fracture{--ink:#edac78}.fine{font-size:11px;color:#91aa9c;line-height:1.6;margin:14px 0 0}.hidden{display:none}#status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:600px){body{padding-top:18px}.intro{font-size:12px}header{margin-bottom:13px}nav{grid-template-columns:repeat(2,1fr);gap:6px}nav button{padding:8px 10px}nav small{font-size:10px}.watch{margin-top:17px;gap:8px}.watch h2{font-size:13px}button{font-size:11px;padding:8px 10px}.playback{gap:5px}figcaption{font-size:11px;padding:9px 11px}header a{font-size:11px}}
.comparison-stage{position:relative}.mini-labels{display:none}@media(max-width:600px){.mini-labels{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;pointer-events:none}.mini-labels span{align-self:start;background:#101f26ed;color:var(--ink);font-size:10px;padding:3px 6px;min-height:20px}} </style></head><body><main><header><div><p class="eyebrow">Wispbound · four new art directions</p><h1>Four different edges</h1><p class="intro">Compare all four, then pick one for a larger video.</p></div><a href="./">Back</a></header><figure><div class="comparison-stage"><video id="comparison" poster="./assets/previews/edge-ideas-grid.jpg" autoplay muted loop playsinline preload="auto" aria-label="Four-way comparison of carved stone, spirit fire, root weave and rift scars"><source src="./assets/previews/edge-ideas-grid.mp4" type="video/mp4"></video><div class="mini-labels" aria-hidden="true"><span class="carved">1 · Carved stone</span><span class="spectral">2 · Spirit fire</span><span class="roots">3 · Root weave</span><span class="fracture">4 · Rift scars</span></div></div><figcaption>Same game scene and motion. Different shape, texture and response.</figcaption></figure><div class="watch"><h2>Enlarge a direction</h2><div class="playback"><button id="still">Compare still</button><button id="pause" aria-pressed="false">Pause videos</button></div></div><nav aria-label="Enlarge an edge direction"><button class="carved" data-style="carved" aria-pressed="true">1 · Carved stone<small>Broad ivory, chipped bevel</small></button><button class="spectral" data-style="spectral" aria-pressed="false">2 · Spirit fire<small>Flowing cyan, luminous fringe</small></button><button class="roots" data-style="roots" aria-pressed="false">3 · Root weave<small>Clustered moss and branch fronds</small></button><button class="fracture" data-style="fracture" aria-pressed="false">4 · Rift scars<small>Orange-red fissures wake nearby</small></button></nav><figure><video id="carved" src="./assets/previews/edge-ideas-carved.mp4" poster="./assets/previews/edge-ideas-carved.jpg" muted loop playsinline preload="metadata" aria-label="Enlarged carved stone treatment"></video><video id="spectral" class="hidden" src="./assets/previews/edge-ideas-spectral.mp4" poster="./assets/previews/edge-ideas-spectral.jpg" muted loop playsinline preload="metadata" aria-label="Enlarged spirit fire treatment"></video><video id="roots" class="hidden" src="./assets/previews/edge-ideas-roots.mp4" poster="./assets/previews/edge-ideas-roots.jpg" muted loop playsinline preload="metadata" aria-label="Enlarged root weave treatment"></video><video id="fracture" class="hidden" src="./assets/previews/edge-ideas-fracture.mp4" poster="./assets/previews/edge-ideas-fracture.jpg" muted loop playsinline preload="metadata" aria-label="Enlarged rift scars treatment"></video><figcaption id="caption">Carved stone · a broad ivory bevel with chipped breaks gives the contact edge a solid, worked shape.</figcaption></figure><p class="fine">Preview-only treatments recorded with the game renderer. These visual passes do not change the default game or your saved flight.</p><p id="status" role="status"></p></main><script>
const videos=[...document.querySelectorAll('video')],comparison=document.querySelector('#comparison'),pause=document.querySelector('#pause');const keys=['carved','spectral','roots','fracture'];let paused=false,selected='carved';
const captions={carved:'Carved stone · a broad ivory bevel with chipped breaks gives the contact edge a solid, worked shape.',spectral:'Spirit fire · a flowing cyan fringe makes the boundary luminous and alive.',roots:'Root weave · clustered moss and branch fronds give the terrain an overgrown outline.',fracture:'Rift scars · orange-red fissures intensify as the Wisp approaches the boundary.'};
function current(){return document.querySelector('#'+selected);}
function seek(video,time){if(Number.isFinite(video.duration)&&video.duration>0)try{video.currentTime=Math.min(time,video.duration-.05);}catch{}}
function align(video){if(Number.isFinite(comparison.currentTime)&&Number.isFinite(video.duration)&&Math.abs(video.currentTime-comparison.currentTime)>.12)seek(video,comparison.currentTime);}
function updatePlayback(){for(const video of videos){video.muted=true;if(paused||document.hidden||(video!==comparison&&video!==current()))video.pause();else video.play()?.catch(()=>{});}}
function pausedUI(){pause.textContent=paused?'Play videos':'Pause videos';pause.setAttribute('aria-pressed',String(paused));}
for(const video of videos)video.addEventListener('loadedmetadata',()=>{seek(video,3);if(video!==comparison&&video===current()&&comparison.readyState>=1)align(video);updatePlayback();},{once:true});
for(const button of document.querySelectorAll('[data-style]'))button.addEventListener('click',()=>{selected=button.dataset.style;for(const key of keys)document.querySelector('#'+key).classList.toggle('hidden',key!==selected);for(const item of document.querySelectorAll('[data-style]'))item.setAttribute('aria-pressed',String(item===button));align(current());document.querySelector('#caption').textContent=captions[selected];updatePlayback();});
pause.addEventListener('click',()=>{paused=!paused;pausedUI();align(current());updatePlayback();});document.querySelector('#still').addEventListener('click',()=>{paused=true;pausedUI();for(const video of videos)video.pause();seek(comparison,3);seek(current(),3);});comparison.addEventListener('timeupdate',()=>{if(!paused)align(current());});document.addEventListener('visibilitychange',updatePlayback);window.addEventListener('pagehide',()=>{for(const video of videos)video.pause();},{once:true});for(const video of videos)video.addEventListener('error',()=>{document.querySelector('#status').textContent='The recording is still loading. Please try again shortly.';});updatePlayback();
</script></body></html>
