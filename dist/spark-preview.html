<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081314">
  <title>Icon preview · Wispbound</title>
  <link rel="stylesheet" href="game-symbols.css?v=spark-arcs-3">
  <link rel="stylesheet" href="map-clarity.css?v=spark-arcs-3">
  <link rel="stylesheet" href="radial-tree.css?v=spark-arcs-3">
  <link rel="stylesheet" href="living-icons.css?v=spark-arcs-3">
  <link rel="stylesheet" href="spark-preview.css?v=spark-arcs-3">
</head>
<body>
  <main>
    <header>
      <h1>Icon preview</h1>
      <div class="controls">
        <button id="scale" type="button" aria-pressed="false">Enlarge icons</button>
        <button id="motion" type="button">Pause motion</button>
      </div>
    </header>
    <section class="menu-sample" aria-label="Menu icons">
      <div><div class="resource-drawing" id="fuel-mark"></div><span>Spark Meter</span></div>
      <div><div class="resource-drawing" id="wallet-mark"></div><span>Stored Sparks</span></div>
      <div><div class="resource-drawing" id="sight-mark"></div><span>Luminance</span></div>
    </section>
    <label class="group-picker">Show
      <select id="group">
        <option value="fuel">Fuel Sparks</option>
        <option value="other">Special Sparks</option>
        <option value="skills">Skills</option>
        <option value="companions">Companions</option>
        <option value="relics">Artifacts</option>
        <option value="sites">Map landmarks</option>
        <option value="bonuses">Flight bonuses</option>
        <option value="controls">Menu symbols</option>
      </select>
    </label>
    <section id="gallery" aria-label="Icon artwork"></section>
    <a class="play" href="./">Play Wispbound →</a>
    <noscript>Enable JavaScript to view the animated Sparks.</noscript>
  </main>
  <script type="module" src="spark-preview.mjs?v=spark-arcs-3"></script>
</body></html>
