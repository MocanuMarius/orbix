<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102127"><title>Three contact lights · Wispbound</title><style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#0d1b20;color:#f0ebd6}*{box-sizing:border-box}body{margin:0;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}main{max-width:960px;margin:auto}header{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:18px}h1{font-size:clamp(23px,4vw,34px);font-weight:600;letter-spacing:-.025em;margin:4px 0 10px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:#96b1a5;margin:0}.intro{margin:0;color:#bacbbf;line-height:1.6;max-width:650px;font-size:13px}a{color:#c2ceb3;text-decoration:none;font-size:12px;padding:8px 0;white-space:nowrap}figure{margin:0;overflow:hidden;border:1px solid #38514d;border-radius:12px;background:#071115}video{display:block;width:100%;height:auto;background:#071115}figcaption{padding:11px 13px;color:#b9cbbd;line-height:1.6;font-size:12px}.legend{display:flex;justify-content:space-around;gap:8px;font-size:12px;color:#dfe4d0;padding:10px 12px 0}.legend span{flex:1;text-align:center}.moon{--ink:#d3e7f0}.living{--ink:#b5d49b}.danger{--ink:#e9bc76}.key::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink);margin-right:6px;vertical-align:2px}.watch{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0 10px}.watch h2{margin:0;font-size:15px;font-weight:500}button{font:inherit;background:#203a35;color:#ecedd6;border:1px solid #496055;border-radius:7px;padding:10px 13px;min-height:44px;cursor:pointer;font-size:12px}button:hover{background:#304d42}button:focus-visible{outline:2px solid #e8d39d;outline-offset:3px}#pause{white-space:nowrap}.playback{display:flex;gap:6px}nav{display:flex;gap:7px;margin-bottom:10px}nav button{flex:1;min-width:0;text-align:left;line-height:1.45;border-top:2px solid var(--ink);color:var(--ink)}nav button[aria-pressed=true]{background:#354e42;border-color:var(--ink)}nav small{display:block;color:#b8c5b9;font-size:10px}.detail{max-width:960px}.fine{font-size:11px;color:#8da99b;line-height:1.6;margin:15px 0 0}.hidden{display:none}#status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:550px){body{padding-top:20px}header{margin-bottom:14px}header a{font-size:10px}.intro{font-size:12px}.legend{font-size:10px;padding:9px 5px 0;gap:2px}nav{gap:5px}nav button{padding:8px 7px;font-size:11px}nav small{font-size:9px}.watch{margin-top:19px}.watch h2{font-size:14px}figcaption{font-size:11px;padding:9px 11px}.key::before{width:4px;height:4px;margin-right:4px}}
</style></head><body><main><header><div><p class="eyebrow">Wispbound · boundary study</p><h1>Compare the terrain edges</h1><p class="intro">Same scene and movement. Only the edge changes.</p></div><a href="./">Back</a></header><figure><video id="comparison" poster="./assets/previews/boundary-comparison.jpg" autoplay muted loop playsinline preload="auto" aria-label="Video comparing Moonlit rim, Living stone, and Danger wake"><source media="(min-width:800px)" src="./assets/previews/boundary-comparison-wide.mp4" type="video/mp4"><source src="./assets/previews/boundary-comparison.mp4" type="video/mp4"></video><div class="legend"><span class="key moon">1 · Moonlit rim</span><span class="key living">2 · Living stone</span><span class="key danger">3 · Danger wake</span></div><figcaption>Recorded in the actual game renderer. Watch the edge beside the Wisp.</figcaption></figure><div class="watch"><h2>Take a closer look</h2><div class="playback"><button id="still">Compare still</button><button id="pause" aria-pressed="false">Pause videos</button></div></div><nav aria-label="Enlarge a direction"><button class="moon" data-style="moon" aria-pressed="true">1 · Moonlit rim<small>Cool ivory contact</small></button><button class="living" data-style="living" aria-pressed="false">2 · Living stone<small>Mineral-green rough contact</small></button><button class="danger" data-style="danger" aria-pressed="false">3 · Danger wake<small>Amber near-danger</small></button></nav><figure class="detail"><video id="moon" src="./assets/previews/boundary-moon.mp4" poster="./assets/previews/boundary-moon.jpg" muted loop playsinline preload="metadata" aria-label="Enlarged Moonlit rim flight"></video><video class="hidden" id="living" src="./assets/previews/boundary-living.mp4" poster="./assets/previews/boundary-living.jpg" muted loop playsinline preload="metadata" aria-label="Enlarged Living stone flight"></video><video class="hidden" id="danger" src="./assets/previews/boundary-danger.mp4" poster="./assets/previews/boundary-danger.jpg" muted loop playsinline preload="metadata" aria-label="Enlarged Danger wake flight"></video><figcaption id="caption">Cool ivory pixels pick out the firm edge, with a local blue glow near the Wisp.</figcaption></figure><p class="fine">Interactive objects keep a soft teal accent in all three directions. Recorded visual passes use the game renderer. They do not change your saved flight.</p><p id="status" role="status"></p></main><script>
const videos=[...document.querySelectorAll('video')],comparison=document.querySelector('#comparison'),pause=document.querySelector('#pause');let paused=false,selected='moon';
const wide=matchMedia('(min-width:800px)');function poster(){comparison.poster='./assets/previews/boundary-comparison'+(wide.matches?'-wide':'')+'.jpg';}poster();wide.addEventListener('change',()=>{poster();const time=comparison.currentTime;comparison.addEventListener('loadedmetadata',()=>{seek(comparison,time);align(current());updatePlayback();},{once:true});comparison.load();});
const captions={moon:'Cool ivory pixels pick out the firm edge, with a local blue glow near the Wisp.',living:'A mineral-green contact seam carries rough notches and small pale highlights.',danger:'The quiet edge gains a local amber pulse as the Wisp approaches.'};
function current(){return document.querySelector('#'+selected);}
function seek(video,time){if(Number.isFinite(video.duration)&&video.duration>0)try{video.currentTime=Math.min(time,video.duration-.05);}catch{}}
function align(video){if(Number.isFinite(comparison.currentTime)&&Number.isFinite(video.duration)&&Math.abs(video.currentTime-comparison.currentTime)>.12)seek(video,comparison.currentTime);}
function updatePlayback(){for(const video of videos){video.muted=true;if(paused||document.hidden||(video!==comparison&&video!==current()))video.pause();else video.play()?.catch(()=>{});}}
function pausedUI(){pause.textContent=paused?'Play videos':'Pause videos';pause.setAttribute('aria-pressed',String(paused));}
for(const video of videos)video.addEventListener('loadedmetadata',()=>{seek(video,3);if(video!==comparison&&video===current()&&comparison.readyState>=1)align(video);updatePlayback();},{once:true});
for(const button of document.querySelectorAll('[data-style]'))button.addEventListener('click',()=>{selected=button.dataset.style;for(const key of ['moon','living','danger'])document.querySelector('#'+key).classList.toggle('hidden',key!==selected);for(const item of document.querySelectorAll('[data-style]'))item.setAttribute('aria-pressed',String(item===button));align(current());document.querySelector('#caption').textContent=captions[selected];updatePlayback();});
pause.addEventListener('click',()=>{paused=!paused;pausedUI();align(current());updatePlayback();});
document.querySelector('#still').addEventListener('click',()=>{paused=true;pausedUI();for(const video of videos)video.pause();seek(comparison,3);seek(current(),3);});
comparison.addEventListener('timeupdate',()=>{if(!paused)align(current());});
document.addEventListener('visibilitychange',updatePlayback);
window.addEventListener('pagehide',()=>{for(const video of videos)video.pause();},{once:true});
for(const video of videos)video.addEventListener('error',()=>{document.querySelector('#status').textContent='The recording is still loading. Please try again shortly.';});updatePlayback();
</script></body></html>
