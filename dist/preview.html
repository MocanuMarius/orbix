<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080f10">
  <title>Wispbound · Pixel landscape preview</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{display:grid;place-items:center;padding:12px;background:#080f10}
    .phone{position:relative;flex:none;overflow:hidden;outline:1px solid #354641;box-shadow:0 14px 45px #0008}
    iframe{display:block;width:900px;height:405px;border:0;transform-origin:top left;background:#101d19}
  </style>
</head>
<body>
  <main class="phone" aria-label="Pixel 10 landscape game preview, 20 to 9 aspect ratio">
    <iframe src="./index.html?v=one-companion-1" title="Wispbound — 900 by 405 landscape game" allow="fullscreen" allowfullscreen></iframe>
  </main>
  <script>
    // Keep the game's viewport landscape even when its host sidebar is tall.
    // Scale the rendered frame, never the game's layout or input coordinates.
    const phone=document.querySelector('.phone'),frame=document.querySelector('iframe');
    const query=new URLSearchParams(location.search);if(query.get('mock')==='rest'){const src=new URL(frame.src);src.searchParams.set('mock','rest');frame.src=src.href;}
    window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==frame.contentWindow||event.data?.type!=='wisp-mock-mode')return;const url=new URL(location.href);if(event.data.enabled)url.searchParams.set('mock','rest');else url.searchParams.delete('mock');history.replaceState(null,'',url);});
    const fit=()=>{const scale=Math.max(.01,Math.min((innerWidth-24)/900,(innerHeight-24)/405));phone.style.width=`${900*scale}px`;phone.style.height=`${405*scale}px`;frame.style.transform=`scale(${scale})`;};
    new ResizeObserver(fit).observe(document.documentElement);fit();
  </script>
</body>
</html>
