<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Design lab frame · Wispbound</title>
<script>
// Production stylesheets, in game.html order, so variants are judged in the real cascade.
const SHEETS=['style','game','boost-control','level-map','companion','progression','orientation','map-clarity','afterglow-ui','tutorial-coach','campaign','pickup-guide','queue-ui','game-art','dream','expedition','landscape','radial-tree','replay','glow-ui','readability','game-symbols','living-icons','choice-art','rest-choices','viewport-layout','typography','death-screen','interface-composition','artifact-reward','artifact-detail','current-batch','menu-art','readability-pass','checkpoint-flow','artifact-collection','rough-ui','journey-art','treasure','ui-contrast','route-bonus','flight-preview','home-commands','home-journey-ink','companion-picker','night-atlas','installation','mobile-rim','skill-book','visual-system','activation-feedback','rhythm-score','card-ui','game-menu','home-utilities','scorecard'];
for(const name of SHEETS)document.write(`<link rel="stylesheet" href="../${name}.css?v=guide-clarity-1">`);
</script>
<link rel="stylesheet" href="variants.css">
</head>
<body class="card-pilot playing">
<main id="app"><section class="flight-shell"><div class="flight-device"><div class="lab-backdrop" aria-hidden="true"><p>Tap Lift to begin<br>Lift Guide is loaned here. The amber chevron opens for a good tap window.</p></div><div id="pause-layer"></div></div></section></main>
<script type="module">
import {menuIcon as icon} from '../menu-icons.mjs?v=guide-clarity-1';
import {resourceSymbol} from '../game-symbols.mjs?v=guide-clarity-1';
import {lifeHeartSvg} from '../lives.mjs?v=guide-clarity-1';

const query=new URLSearchParams(location.search);
const variant=query.get('variant')||'v1.5-pause',ctx=query.get('ctx')||'practice';
const practice=ctx==='practice',onMap=ctx==='map';
const context=practice?'FIRST LIGHT PRACTICE · STOP 2/7':'ASCENSION 1 · MAP 1/3 · STOP 4/10';

// v0-pause: the shipped markup, copied from showMenu() in app.mjs.
function current(){
 return `<div class="pause-overlay menu-pause"><header class="run-pause-heading"><span>${practice?'SEPARATE PRACTICE':'ASCENSION 1 · MAP 1/3'}</span><h2>Paused</h2></header>
 <div class="run-pause-actions"><button class="primary">Resume flight</button><button class="secondary">${practice?'Exit tutorial':'Exit to Menu'}</button></div>
 <p class="run-pause-note">${practice?'Separate practice':'Exit saves the flight entrance.'}</p>
 <div class="run-tools"><button>${icon('route')}${practice?'LOANED CARDS':'DECK'}</button><button>${icon('star')}ARTIFACTS</button>${onMap?'<button>MAP GUIDE</button>':''}<button>${icon('info')}FIELD GUIDE</button><button>GLOSSARY</button><button>${icon('tune')}SETTINGS</button></div>
 <div class="audio-controls"><button class="secondary" aria-pressed="true">${resourceSymbol('music')}MUSIC ON</button><button class="secondary" aria-pressed="true">${icon('sound')}FX ON</button></div>
 ${practice?'<button class="secondary">Skip practice</button>':'<button class="run-menu-danger">Abandon run</button>'}</div>`;
}

// v1.0-pause: one ordered column. Resume first, build, help, settings; leaving is fenced off below.
function column(){
 const build=practice
  ?`<button class="pm-item">${icon('route')}<span>Loaned Cards</span></button>`
  :`<div class="pm-split"><button class="pm-item">${icon('route')}<span>Deck</span></button><button class="pm-item">${icon('star')}<span>Collection</span></button></div>`;
 const leave=practice
  ?`<button class="pm-item pm-quiet"><span>Skip practice</span></button><button class="pm-item pm-quiet pm-exit"><span>Exit to Menu</span></button>`
  :`<button class="pm-item pm-quiet pm-exit"><span>Exit to Menu</span></button><button class="pm-item pm-quiet pm-danger"><span>Abandon run</span></button>`;
 return `<div class="pause-overlay menu-pause-v1" role="dialog" aria-label="Paused">
  <header class="pm-head"><h2>Paused</h2><span>${context}</span></header>
  <nav class="pm-col" aria-label="Pause menu">
   <button class="pm-item pm-resume"><span>Resume flight</span></button>
   ${build}
   <button class="pm-item">${icon('info')}<span>Help</span></button>
   <button class="pm-item">${icon('tune')}<span>Settings</span></button>
   <div class="pm-rule" role="separator"></div>
   <div class="pm-split pm-leave">${leave}</div>
  </nav></div>`;
}

// Waystone theme: every menu entry is the Home screen's carved sign. role = primary | standard | quiet | danger.
const ARROW='<svg class="front-arrow" viewBox="0 0 20 20" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M3 8h8V4h2v2h2v2h2v2h2v1h-2v2h-2v2h-2v2h-2v-5H3z"/></svg>';
function sign(role,title,{sub='',art=''}={}){
 const plain=role==='quiet'||role==='danger';
 return `<button type="button" class="wb-sign wb-sign-${role}">${art&&!plain?`<i class="wb-sign-art">${art}</i>`:''}<span class="wb-sign-text"><b>${title}</b>${sub&&!plain?`<small>${sub}</small>`:''}</span>${plain?'':ARROW}</button>`;
}

// v1.1-pause: the order of v1.0, drawn with the theme.
// A sound toggle: the state is spelled out and the plaque weathers when it is off.
function toggle(name,art,on=true){
 return `<button type="button" class="wb-sign wb-sign-standard wb-toggle" aria-pressed="${on}"><i class="wb-sign-art">${art}</i><span class="wb-sign-text"><b><span class="wb-toggle-name">${name} </span><span class="wb-toggle-state">${on?'On':'Off'}</span></b></span></button>`;
}
// Level control: tap the icon to mute, tap a bar to set the volume.
function level(name,art,value,beat=false){
 return `<div class="wb-level" data-name="${name}" data-level="${value}" data-last="${value||3}"${beat?' data-beat':''}><button type="button" class="wb-level-icon" aria-pressed="${value>0}" aria-label="${name} ${value>0?'on':'off'}">${art}</button><div class="wb-level-bars" role="slider" tabindex="0" aria-label="${name} volume" aria-valuemin="0" aria-valuemax="4" aria-valuenow="${value}">${[1,2,3,4].map(step=>`<i class="${step<=value?'lit':''}"></i>`).join('')}</div></div>`;
}
const levelBlock=()=>`<div class="pm-sound wb-sound" role="group" aria-label="Sound">${level('Music',resourceSymbol('music'),3,true)}${level('FX',icon('sound'),4)}</div>`;
function setLevel(control,value){
 control.dataset.level=value;if(value>0)control.dataset.last=value;
 control.querySelectorAll('.wb-level-bars>i').forEach((bar,index)=>bar.classList.toggle('lit',index<value));
 control.querySelector('.wb-level-bars').setAttribute('aria-valuenow',value);
 const button=control.querySelector('.wb-level-icon');button.setAttribute('aria-pressed',String(value>0));button.setAttribute('aria-label',`${control.dataset.name} ${value>0?'on':'off'}`);
}
const soundBlock=()=>`<div class="pm-sound" role="group" aria-label="Sound">${toggle('Music',resourceSymbol('music'))}${toggle('FX',icon('sound'))}</div>`;
const titleRow=(text,ornate)=>ornate?`<div class="wb-title-row"><i class="wb-flourish" aria-hidden="true"></i><h2 class="wb-title">${text}</h2><i class="wb-flourish wb-flip" aria-hidden="true"></i></div>`:`<h2 class="wb-title">${text}</h2>`;

function waystone(theme='',{sound=false,ornate=false,levels=false,beside=false}={}){
 if(levels)sound=true;
 const build=practice
  ?sign('standard','Loaned Cards',{sub:'Your practice build',art:icon('route')})
  :`<div class="pm-split">${sign('standard','Deck',{sub:'Cards',art:icon('route')})}${sign('standard','Collection',{sub:'Relics',art:icon('star')})}</div>`;
 const leave=practice
  ?sign('quiet','Skip practice')+sign('quiet','Exit to Menu')
  :sign('quiet','Exit to Menu')+sign('danger','Abandon run');
 return `<div class="pause-overlay menu-pause-v11 wb-ground ${theme}" role="dialog" aria-label="Paused">
  ${ornate?'<div class="wb-treeline" aria-hidden="true"></div>':''}${beside?'':levels?levelBlock():sound?soundBlock():''}
  <header class="pm-head">${titleRow('Paused',ornate)}<span class="wb-context">${context}</span></header>
  <nav class="pm-col" aria-label="Pause menu">
   ${sign('primary','Resume flight',{sub:'Back to the passage'})}
   ${build}
   ${sign('standard','Help',{sub:onMap?'Guide, glossary & map symbols':'Guide, glossary & pickups',art:icon('info')})}
   ${sign('standard','Settings',{sub:sound?'Display & options':'Sound & options',art:icon('tune')})}
   <div class="wb-rule" role="separator"></div>
   <div class="pm-split">${leave}</div>
   ${beside?levelBlock():''}
  </nav>${theme.includes('wb-lit')?'<div class="wb-shade" aria-hidden="true"></div>':''}</div>`;
}

// v1.0-settings: settings only, in three named groups, built from approved kit pieces.
function settingsSheet(){
 const row=(name,control)=>`<div class="set-row"><span class="set-label">${name}</span>${control}</div>`;
 const bars=(name,art,value,beat)=>level(name,art,value,beat);
 return `<div class="pause-overlay wb-ground wb-t2 wb-t3 wb-flat set-v1" role="dialog" aria-label="Settings">
  <div class="wb-treeline" aria-hidden="true"></div>
  <header class="pm-head">${titleRow('Settings',true)}</header>
  <div class="set-grid">
   <section aria-label="Sound"><h3 class="set-group">Sound</h3>
    ${row('Music',bars('Music',resourceSymbol('music'),3,true))}
    ${row('FX',bars('FX',icon('sound'),4))}
   </section>
   <section aria-label="Gameplay"><h3 class="set-group">Gameplay</h3>
    ${toggle('Lessons',icon('info'),true)}
    ${sign('standard','Speed',{sub:'Baseline'})}
   </section>
   <section aria-label="App"><h3 class="set-group">App</h3>
    ${sign('standard','Install game',{sub:'Play offline'})}
    ${sign('standard','Updates',{sub:'Version collector-cards-1'})}
    ${sign('standard','Credits',{sub:'Art & music'})}
   </section>
  </div>
  <footer class="set-foot">${sign('quiet','Back')}${sign('quiet','Advanced')}</footer>
 </div>`;
}
function settingsCurrent(){
 return `<div class="pause-overlay menu-pause" style="display:grid;place-items:center"><div style="width:700px;max-width:96%;border:2px solid #8c916c;background:#1c2c22;padding:8px 12px;box-sizing:border-box"><header class="settings-heading" style="display:flex;justify-content:space-between"><h2 style="margin:0;font:23px/1.1 var(--pixel);color:#f3e6b9">Settings</h2><span style="font:12px var(--pixel);color:#bbcbb3">Cards</span></header>
 <div class="settings-grid" style="margin:8px 0">${['♪ MUSIC ON','FX ON','Tutorial','Field Guide','Glossary','Relic almanac','Advanced','Install Wispbound'].map(text=>`<button class="secondary" style="height:44px;font:15px var(--pixel)">${text}</button>`).join('')}</div>
 <footer style="display:flex;justify-content:flex-end"><button class="primary" style="min-width:130px;height:44px;font:17px var(--pixel)">Back</button></footer></div></div>`;
}

// v2.4-theme: the book resting over the lost woods. Side areas carry the run's state and the sound controls.
function atlasPage(extra=''){
 const build=practice
  ?sign('standard','Loaned Cards',{sub:'Your practice build',art:icon('route')})
  :`<div class="pm-split">${sign('standard','Deck',{sub:'Cards',art:icon('route')})}${sign('standard','Collection',{sub:'Relics',art:icon('star')})}</div>`;
 const leave=practice?sign('quiet','Skip practice')+sign('quiet','Exit to Menu'):sign('quiet','Exit to Menu')+sign('danger','Abandon run');
 const hearts=[false,false,true].map(spent=>lifeHeartSvg(spent)).join('');
 return `<div class="pause-overlay menu-pause-v11 wb-ground wb-t2 wb-t3 wb-flat wb-atlas wb-a2 ${extra}" role="dialog" aria-label="Paused">
  <img class="wb-world" src="../assets/moonwell-title.webp" alt="" draggable="false">
  <div class="wb-shade2" aria-hidden="true"></div>
  <aside class="wb-side wb-side-left" aria-label="Your run"><div class="wb-tabbox">
   <div class="wb-stat" aria-label="2 of 3 hearts"><span class="wb-stat-hearts">${hearts}</span></div>
   <div class="wb-stat" aria-label="Spark Meter 18 of 30">${resourceSymbol('energy')}<b>18 / 30</b></div>
   <div class="wb-stat" aria-label="8 Stored Sparks">${resourceSymbol('packed')}<b>8</b></div>
  </div></aside>
  <div class="wb-page"><div class="wb-pagelight" aria-hidden="true"></div>
   <header class="pm-head">${titleRow('Paused',true)}<span class="wb-context">${context}</span></header>
   <nav class="pm-col" aria-label="Pause menu">
    ${sign('primary','Resume flight',{sub:'Back to the passage'})}
    ${build}
    ${sign('standard','Help',{sub:onMap?'Guide, glossary & map symbols':'Guide, glossary & pickups',art:icon('info')})}
    ${sign('standard','Settings',{sub:'Display & options',art:icon('tune')})}
    <div class="wb-rule" role="separator"></div>
    <div class="pm-split">${leave}</div>
   </nav>
  </div>
  <aside class="wb-side wb-side-right"><div class="wb-tabbox wb-sound" role="group" aria-label="Sound">${level('Music',resourceSymbol('music'),3,true)}${level('FX',icon('sound'),4)}</div></aside>
 </div>`;
}

// v1.1-icons: five takes on the Glint.
function glintSheet(){
 const img=(id,size)=>`<img src="assets/spark-${id}.svg" width="${size}" height="${size}" alt="" style="image-rendering:pixelated">`;
 const col=(code,name,id)=>`<section class="ic-col"><h3 class="set-group">${code}</h3><p class="ic-name">${name}</p>
   <div class="ic-sizes">${img(id,16)}${img(id,32)}${img(id,48)}</div>
   <div class="ic-leather">${img(id,32)}<b>18 / 30</b></div></section>`;
 return `<div class="pause-overlay menu-pause-v11 wb-ground wb-t2 wb-t3 wb-flat wb-atlas wb-a2 wb-go ic-v1 ic-v11" role="dialog" aria-label="Glint variations">
  <img class="wb-world" src="../assets/moonwell-title.webp" alt="" draggable="false"><div class="wb-shade2" aria-hidden="true"></div>
  <div class="wb-page"><header class="pm-head">${titleRow('The Glint',true)}<span class="wb-context">Five takes · 16-pixel grid · shown at 16, 32, 48</span></header>
   <div class="ic-grid">
    ${col('A1','Classic','a')}${col('A2','Eight rays','a2')}${col('A3','Bold','a3')}${col('A4','Twin','a4')}${col('A5','Round','a5')}
   </div></div></div>`;
}

// v1.0-icons: three Spark candidates on one 16-pixel grid, beside today's Spark.
function iconSheet(){
 const img=(id,size)=>`<img src="assets/spark-${id}.svg" width="${size}" height="${size}" alt="" style="image-rendering:pixelated">`;
 const now=size=>`<span class="ic-now" style="width:${size}px;height:${size}px">${resourceSymbol('energy')}</span>`;
 const col=(code,name,draw)=>`<section class="ic-col"><h3 class="set-group">${code}</h3><p class="ic-name">${name}</p>
   <div class="ic-sizes">${draw(16)}${draw(32)}${draw(48)}</div>
   <div class="ic-leather">${draw(32)}<b>18 / 30</b></div></section>`;
 return `<div class="pause-overlay menu-pause-v11 wb-ground wb-t2 wb-t3 wb-flat wb-atlas wb-a2 wb-go ic-v1" role="dialog" aria-label="Spark icon">
  <img class="wb-world" src="../assets/moonwell-title.webp" alt="" draggable="false"><div class="wb-shade2" aria-hidden="true"></div>
  <div class="wb-page"><header class="pm-head">${titleRow('The Spark',true)}<span class="wb-context">One grid · 16 pixels · shown only at 16, 32 or 48</span></header>
   <div class="ic-grid">
    ${col('Today','20-pixel grid, shown at 13 to 18',now)}
    ${col('A','Glint',size=>img('a',size))}
    ${col('B','Charged orb',size=>img('b',size))}
    ${col('C','Ember',size=>img('c',size))}
   </div></div></div>`;
}

// v1.0-theme: the kit itself.
// The kit follows the user's verdicts: pieces are marked Approved once a look that uses them is accepted.
function kit(grained=false){
 const piece=(status,caption,markup)=>`<figure>${markup}<figcaption><b class="kit-${status==='Approved'?'ok':'new'}">${status}</b> ${caption}</figcaption></figure>`;
 if(grained)return `<div class="theme-sheet theme-kit wb-ground wb-t2 wb-t3">
  <div class="wb-treeline" aria-hidden="true"></div>
  <header>${titleRow('Waystone',true)}<span class="wb-context">The component kit · ${variant}</span></header>
  ${piece('Approved','Plaque shapes and the four stones',sign('primary','Resume flight',{sub:'Back to the passage'}))}
  ${piece('Proposed','Stone grain and edge clasps on every plaque',sign('standard','Settings',{sub:'Display & options',art:icon('tune')}))}
  ${piece('Approved','Paired plaques',`<div class="pm-split">${sign('standard','Deck',{sub:'Cards',art:icon('route')})}${sign('standard','Collection',{sub:'Relics',art:icon('star')})}</div>`)}
  ${piece('Approved','Weathered · leave  ·  Rust · cannot be undone',`<div class="pm-split">${sign('quiet','Exit to Menu')}${sign('danger','Abandon run')}</div>`)}
  ${piece('Proposed','Level control · tap the icon to mute, a bar to set volume',`<div class="wb-sound" style="justify-items:start;grid-auto-flow:column;gap:18px">${level('Music',resourceSymbol('music'),3,true)}${level('FX',icon('sound'),0)}</div>`)}
  ${piece('Proposed','Title flourish, carved rule and the treeline ground','<div class="wb-rule"></div>')}
 </div>`;
 return `<div class="theme-sheet theme-kit wb-ground wb-t2">
  <div class="wb-treeline" aria-hidden="true"></div>
  <header>${titleRow('Waystone',true)}<span class="wb-context">The component kit · ${variant}</span></header>
  ${piece('Approved','Gold plaque · the one next step',sign('primary','Resume flight',{sub:'Back to the passage'}))}
  ${piece('Approved','Basalt plaque · go somewhere',sign('standard','Settings',{sub:'Display & options',art:icon('tune')}))}
  ${piece('Approved','Paired plaques',`<div class="pm-split">${sign('standard','Deck',{sub:'Cards',art:icon('route')})}${sign('standard','Collection',{sub:'Relics',art:icon('star')})}</div>`)}
  ${piece('Approved','Weathered · leave or step back  ·  Rust · cannot be undone',`<div class="pm-split">${sign('quiet','Exit to Menu')}${sign('danger','Abandon run')}</div>`)}
  ${piece('Proposed','Toggle · state spelled out, weathers when off',`<div class="pm-split">${toggle('Music',resourceSymbol('music'),true)}${toggle('FX',icon('sound'),false)}</div>`)}
  ${piece('Proposed','Title flourish, carved rule and the treeline ground','<div class="wb-rule"></div>')}
 </div>`;
}

function themeSheet(theme=''){
 const piece=(caption,markup)=>`<figure>${markup}<figcaption>${caption}</figcaption></figure>`;
 return `<div class="theme-sheet wb-ground ${theme}">
  <header><h2 class="wb-title">Waystone</h2><span class="wb-context">One menu language · ${variant}</span></header>
  ${piece('Primary sign · the one next step (gold)',sign('primary','Resume flight',{sub:'Back to the passage'}))}
  ${piece('Standard sign · go somewhere',sign('standard','Settings',{sub:'Sound & options',art:icon('tune')}))}
  ${piece('Standard signs, paired',`<div class="pm-split">${sign('standard','Deck',{sub:'Cards',art:icon('route')})}${sign('standard','Collection',{sub:'Relics',art:icon('star')})}</div>`)}
  ${piece('Quiet sign · leave or step back  ·  Rust sign · cannot be undone',`<div class="pm-split">${sign('quiet','Exit to Menu')}${sign('danger','Abandon run')}</div>`)}
  ${piece('Carved rule · fences off a group','<div class="wb-rule"></div>')}
  ${piece('Title and context line','<span class="wb-context">Ascension 1 · Map 1/3 · Stop 4/10</span>')}
 </div>`;
}

const VARIANTS={'v0-pause':current,'v1.0-pause':column,'v1.1-pause':waystone,'v1.0-theme':themeSheet,'v1.2-pause':()=>waystone('wb-t2'),'v1.1-theme':()=>themeSheet('wb-t2'),'v1.3-pause':()=>waystone('wb-t2 menu-pause-v13',{sound:true,ornate:true}),'v1.2-theme':()=>kit(),'v1.4-pause':()=>waystone('wb-t2 wb-t3 menu-pause-v14',{ornate:true,levels:true}),'v1.3-theme':()=>kit(true),'v1.5-pause':()=>waystone('wb-t2 wb-t3 wb-flat menu-pause-v15',{ornate:true,levels:true,beside:true}),'v1.4-theme':()=>kit(true).replace('wb-t3"','wb-t3 wb-flat"').replace('Stone grain and edge clasps','Edge clasp'),'v1.5-theme':()=>kit(true).replace('wb-t3"','wb-t3 wb-flat"').replace('Stone grain and edge clasps','Edge clasp').replaceAll('kit-new">Proposed','kit-ok">Approved'),'v1.0-settings':settingsSheet,'v1.1-settings':settingsSheet,
 'v2.0-theme':()=>waystone('wb-t2 wb-t3 wb-flat menu-pause-v15 wb-atlas',{ornate:true,levels:true,beside:true}),
 'v2.1-theme':()=>waystone('wb-t2 wb-t3 wb-flat menu-pause-v15 wb-lantern',{ornate:true,levels:true,beside:true}),
 'v2.5-pause':()=>atlasPage('wb-go'),
 'v1.0-icons':iconSheet,'v1.1-icons':glintSheet,
 'v2.4-theme':()=>atlasPage(),'v2.5-theme':()=>atlasPage('wb-go'),
 'v2.3-theme':()=>waystone('wb-t2 wb-t3 wb-flat menu-pause-v15 wb-atlas wb-lit wb-lit3 wb-tab',{ornate:true,levels:true,beside:true}),
 'v2.2-theme':()=>waystone('wb-t2 wb-t3 wb-flat menu-pause-v15 wb-atlas wb-lit',{ornate:true,levels:true,beside:true}),'v0-settings':settingsCurrent};
document.querySelector('#pause-layer').innerHTML=(VARIANTS[variant]||VARIANTS['v1.5-pause'])();
document.addEventListener('click',event=>{
 const mute=event.target.closest('.wb-level-icon'),bars=event.target.closest('.wb-level-bars');
 if(mute){const control=mute.closest('.wb-level');setLevel(control,Number(control.dataset.level)>0?0:Number(control.dataset.last)||3);}
 else if(bars){const box=bars.getBoundingClientRect();setLevel(bars.closest('.wb-level'),Math.max(1,Math.min(4,Math.ceil((event.clientX-box.left)/box.width*4))));}
});
document.addEventListener('keydown',event=>{const bars=event.target.closest?.('.wb-level-bars');if(!bars||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;event.preventDefault();const control=bars.closest('.wb-level'),step=event.key==='ArrowRight'||event.key==='ArrowUp'?1:-1;setLevel(control,Math.max(0,Math.min(4,Number(control.dataset.level)+step)));});
// Toggles work in the preview so the off state can be judged too.
document.addEventListener('click',event=>{const button=event.target.closest('.wb-toggle');if(!button)return;const on=button.getAttribute('aria-pressed')!=='true';button.setAttribute('aria-pressed',String(on));button.querySelector('.wb-toggle-state').textContent=on?'On':'Off';});
document.documentElement.dataset.variant=variant;
</script>
</body>
</html>
